name: build-pns-headless

on:
  push:
    branches: [pns-headless]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/kicad/kicad-ci/source_containers/master/fedora:41
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: ccache-pns-${{ github.sha }}
          restore-keys: ccache-pns-

      - name: Configure
        run: |
          mkdir -p build/linux build/ccache
          cd build/linux
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKICAD_BUILD_PNS_DEBUG_TOOL=ON \
            -DKICAD_USE_CMAKE_FINDPROTOBUF=ON \
            -DCCACHE_DIR=${GITHUB_WORKSPACE}/build/ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ../../

      - name: Build pcbnew
        run: |
          cd build/linux
          ninja -j$(nproc) pcbnew 2>&1 | tail -80

      - name: Collect artifacts
        run: |
          mkdir -p out
          find build/linux -name "_pcbnew.so*" -exec cp {} out/ \;
          find build/linux -name "pcbnew.py" -exec cp {} out/ \;
          find build/linux -name "kicad-cli" -type f -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: pcbnew-pns-headless
          path: out/
          retention-days: 14
